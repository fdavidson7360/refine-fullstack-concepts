<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lightweight Flask Sidebar</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #f4f6f9;
            color: #333;
        }

        h1 {
            margin-bottom: 15px;
            color: #0f172a;
        }
    </style>
</head>
<body>
    <div style="width: 250px; background-color: #1e293b; color: white; padding: 20px;">
        <h1>About Us</h1>
        <p id="welcome">Welcome to our simple Flask app!</p>
    </div> 
    <div>
        <button id="clickButton" type="button">Click Me</button>
        <p id="output"></p>

        <br><br>
        <canvas id="myCanvas" width="500" height="400" style="border:1px solid #000;"></canvas>
    </div>
    

    <!-- Add the script area with the tojson filter -->
       <script>
           // Embed Python data safely as a JavaScript object or array

           window.AppContext = {
               name: {{ name | tojson | safe }}
           };

           console.log("Name from Flask:", window.AppContext.name);
       </script>
       <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
</body>
</html>
